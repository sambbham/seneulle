services:
  web:
    build: .
    container_name: ${CONTAINER_NAME:-threadly-store}
    ports:
      - "${HOST_PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - DB_PATH=${DB_PATH:-/app/data/db.json}
    # Keep store data (products, orders, customers, settings) on the host,
    # so it survives container rebuilds and restarts.
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/api/data"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
